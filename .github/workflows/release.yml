name: release

# Continuous delivery for both editions of the project:
#   - the DESKTOP edition and the research API: the reproducibly built wheel
#     (`pip install "prometheus_econ-<version>-py3-none-any.whl[desktop]"`, then `econosim desktop`);
#   - the WEB edition: the built frontend (`frontend/dist`) as a tarball, served by
#     `python -m prometheus.webgateway serve --dist <dir>` (or the Docker image, see docker-compose.yml).
#
# A release is made ONLY by pushing a tag `v<version>` that matches pyproject.toml. A manual run
# ("Run workflow") does everything except create the release, so the whole pipeline can be tried
# without publishing anything; its files are kept as a run artifact for 7 days.
#
# What this does not do, on purpose: push a container image to a registry, sign anything, or build
# a bundled desktop binary (that would carry Qt's LGPL obligations; see docs/LICENSE_INVENTORY.md).
# Checksums are published so a download can be checked; they are not a signature.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"
      - name: Read the version and, for a tag, require that it matches
        id: read
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v${version}" ]; then
            echo "::error::tag ${REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }

  wheel:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"
      - name: Bootstrap pinned package tool with verified wheel hashes
        run: python -m pip install --require-hashes --only-binary=':all:' -r requirements/bootstrap.txt
      - name: Check and install the locked build group
        run: uv sync --locked --group build --no-install-project --no-build --python 3.14.7
      - name: Build the wheel twice from independent source snapshots and compare
        run: python tools/reproducible_build.py --uv "$(command -v uv)" --output dist/verified
      - name: Smoke-test the wheel with the desktop extra's import path absent
        run: |
          uv pip install --python .venv/bin/python --no-deps --offline dist/verified/*.whl
          .venv/bin/python -c "import prometheus; print('wheel imports', prometheus.__name__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel
          path: dist/verified/
          if-no-files-found: error
          retention-days: 7

  web:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Pack the build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2000-01-01 00:00:00Z' \
            -czf "out/econosim-web-${VERSION}.tar.gz" -C frontend dist
          tar -tzf "out/econosim-web-${VERSION}.tar.gz" | grep -q '^dist/index.html$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web
          path: out/
          if-no-files-found: error
          retention-days: 7

  container:
    # Builds the web edition's image to prove the Dockerfile still produces one. It is not pushed.
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the runtime image
        run: docker build --target runtime --tag econosim-web:release-check .

  publish:
    # The only job that can write, and it runs only for a tag.
    if: github.ref_type == 'tag'
    needs: [version, wheel, web, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - name: Gather the files, checksums and the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp docs/release/dependency-sbom.cdx.json "assets/econosim-${VERSION}-sbom.cdx.json"
          (cd assets && sha256sum -- * | grep -v SHA256SUMS > SHA256SUMS)
          awk -v v="## [${VERSION}]" 'index($0, v)==1 {on=1; next} /^## \[/ && on {exit} on' CHANGELOG.md > notes.md
          {
            echo
            echo "### Two editions"
            echo "- **Desktop:** \`pip install 'prometheus_econ-${VERSION}-py3-none-any.whl[desktop]'\` then \`econosim desktop\` (Linux needs \`libxcb-cursor0\`)."
            echo "- **Web:** unpack \`econosim-web-${VERSION}.tar.gz\` and serve it with \`python -m prometheus.webgateway serve --dist dist\`, or use \`docker compose up\`."
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS\`. Research software: NO-GO for trading or advice."
          } >> notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --verify-tag --title "$TAG" --notes-file notes.md
