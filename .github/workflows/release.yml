name: release

# Continuous delivery for both editions of the project:
#   - the DESKTOP edition and the research API: the reproducibly built wheel
#     (`pip install "prometheus_econ-<version>-py3-none-any.whl[desktop]"`, then `econosim desktop`);
#   - the WEB edition: the built frontend (`frontend/dist`) as a tarball, served by
#     `python -m prometheus.webgateway serve --dist <dir>` (or the Docker image, see docker-compose.yml).
#
# A release is made ONLY by pushing a tag `v<version>` that matches pyproject.toml. A manual run
# ("Run workflow") does everything except create the release, so the whole pipeline can be tried
# without publishing anything; its files are kept as a run artifact for 7 days.
#
# What this does not do, on purpose: push a container image to a registry, sign anything, or build
# a bundled desktop binary (that would carry Qt's LGPL obligations; see docs/LICENSE_INVENTORY.md).
# Checksums are published so a download can be checked; they are not a signature. Each release file also
# gets a signed build-provenance attestation (docs/release/VERIFYING.md), which is the signature-like part:
# it ties the bytes to this workflow and commit, and says nothing about whether the code is safe.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Read the version and, for a tag, require that it matches
        id: read
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v${version}" ]; then
            echo "::error::tag ${REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for ${version}"; exit 1; }
          grep -q "^version: ${version}$" CITATION.cff || { echo "::error::CITATION.cff does not name version ${version}"; exit 1; }

  wheel:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Bootstrap pinned package tool with verified wheel hashes
        run: python -m pip install --require-hashes --only-binary=':all:' -r requirements/bootstrap.txt
      - name: Check and install the locked build group
        run: uv sync --locked --group build --no-install-project --no-build --python 3.14.7
      - name: Build the wheel twice from independent source snapshots and compare
        run: python tools/reproducible_build.py --uv "$(command -v uv)" --output dist/verified
      - name: Smoke-test the wheel with the desktop extra's import path absent
        run: |
          uv pip install --python .venv/bin/python --no-deps --offline dist/verified/*.whl
          .venv/bin/python -c "import prometheus; print('wheel imports', prometheus.__name__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/verified/
          if-no-files-found: error
          retention-days: 7

  web:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install, test and build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Pack the build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='2000-01-01 00:00:00Z' \
            -czf "out/econosim-web-${VERSION}.tar.gz" -C frontend dist
          tar -tzf "out/econosim-web-${VERSION}.tar.gz" | grep -q '^dist/index.html$'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: out/
          if-no-files-found: error
          retention-days: 7

  container:
    # Builds the web edition's image to prove the Dockerfile still produces one. It is not pushed.
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the runtime image
        run: docker build --target runtime --tag econosim-web:release-check .

  publish:
    # The only job that can write, and it runs only for a tag.
    if: github.ref_type == 'tag'
    needs: [version, wheel, web, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # contents: create the release. id-token: mint the OIDC token for a short-lived Sigstore signing
      # certificate. attestations: store the signed build-provenance attestation.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Gather the files, checksums and the release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cp docs/release/dependency-sbom.cdx.json "assets/econosim-${VERSION}-sbom.cdx.json"
          # The source archive is what the Linux installer uses: the labs read data_cache/ beside the
          # source tree, which a wheel does not carry. The installer ships next to it.
          git archive --format=tar.gz --prefix="econosim-${VERSION}/" -o "assets/econosim-source-${VERSION}.tar.gz" HEAD
          cp scripts/install-linux.sh assets/install-linux.sh
          (cd assets && sha256sum -- * | grep -v SHA256SUMS > SHA256SUMS)
          awk -v v="## [${VERSION}]" 'index($0, v)==1 {on=1; next} /^## \[/ && on {exit} on' CHANGELOG.md > notes.md
          {
            echo
            echo "### Two editions"
            echo "- **Desktop (Linux):** \`bash install-linux.sh\` (read it first; no root; adds ECONOSIM to the application menu and, with its icon, to the desktop). Qt needs \`libxcb-cursor0\` on X11."
            echo "- **Desktop (other systems):** from a source checkout, \`pip install -e '.[desktop,quantum]'\` then \`econosim desktop\`; jobs need Linux."
            echo "- **Web:** unpack \`econosim-web-${VERSION}.tar.gz\` and serve it with \`python -m prometheus.webgateway serve --dist dist\`, or use \`docker compose up\`."
            echo
            echo "Verify downloads with \`sha256sum -c SHA256SUMS\`, and where a file came from with \`gh attestation verify <file> --repo Plovaxs/economisms\` (docs/release/VERIFYING.md). Research software: NO-GO for trading or advice."
          } >> notes.md
          test -s notes.md
      - name: Attest the build provenance of every release file
        # A signed statement, stored by GitHub, that these exact bytes were produced by this workflow at
        # this commit (SLSA build provenance, verifiable with `gh attestation verify`; see
        # docs/release/VERIFYING.md). It runs BEFORE the release is created, so a failure here publishes
        # nothing. It proves where a file came from, not that the code in it is safe.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" assets/* --verify-tag --title "$TAG" --notes-file notes.md
