# TLS overlay for docker-compose.yml: the gateway terminates HTTPS itself, with
# a certificate and key you supply, instead of speaking cleartext HTTP.
#
#   mkdir -p tls
#   # your own certificate, or a throwaway self-signed one for local use:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 30 -subj "/CN=localhost" \
#     -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
#     -keyout tls/key.pem -out tls/cert.pem
#   # the containers run as uid 10001, so that user must be able to read them
#   # (a bind-mounted secret keeps the host file's numeric owner and mode):
#   sudo chown 10001:10001 tls/key.pem tls/cert.pem && chmod 0400 tls/key.pem
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   curl --cacert tls/cert.pem https://localhost:8443/health/live
#
# What changes: the published port moves to 8443 and serves TLS (HSTS, and a
# CSP that upgrades insecure requests, only ever appear on HTTPS responses);
# `--allow-non-loopback-without-tls` is gone, so the gateway REFUSES to bind
# a network interface without a certificate. The port is still bound to the
# host's loopback: put a reverse proxy or a firewall rule in front of it
# deliberately if it should be reachable from elsewhere -- this file never
# widens the mapping for you. Every other container is unchanged (it still
# shares the gateway's network namespace and binds 127.0.0.1).
#
# Not claimed: certificate issuance, rotation or revocation (bring your own),
# or that a single-host compose stack is a production deployment -- see
# SECURITY.md and docs/THREAT_MODEL.md for what this project does and does not
# verify.

services:
  webgateway:
    command:
      - python
      - -m
      - prometheus.webgateway
      - serve
      - --dist
      - /app/frontend/dist
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --tls-cert
      - /run/secrets/tls_cert
      - --tls-key
      - /run/secrets/tls_key
    ports: !override
      - "127.0.0.1:8443:8443"
    secrets:
      - tls_cert
      - tls_key
    healthcheck:
      test: !override
        - CMD
        - python
        - -c
        - "import ssl, sys, urllib.request; sys.exit(0 if urllib.request.urlopen('https://127.0.0.1:8443/health/live', timeout=3, context=ssl._create_unverified_context()).status == 200 else 1)"

secrets:
  tls_cert:
    file: ./tls/cert.pem
  tls_key:
    file: ./tls/key.pem
