name: frontend-ci

# Scoped to frontend/ via `paths` so this never runs on, or blocks,
# ordinary Python-only changes -- a completely separate CI surface
# from .github/workflows/ci.yml, same discipline that keeps the
# frontend itself an additive, non-replacing piece of this repo.
on:
  push:
    paths: ["frontend/**"]
  pull_request:
    paths: ["frontend/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: The ordinary build holds no demo recording
        run: |
          npm run build
          ! ls dist/assets | grep -q '^recording-'
      - name: The demo edition builds and holds it
        run: |
          npm run build:demo
          ls dist/assets | grep -q '^recording-'
