name: mutation-check

# Would the tests notice if a critical rule were broken on purpose? tools/mutation_check.py injects one
# deliberate fault at a time (a flipped sign, a dropped check, an off-by-one) into the double-entry
# ledger, the Black-Scholes closed forms, the risk metrics, the hedging accounting and the block
# bootstrap, runs only the tests meant to guard each, and fails if any fault SURVIVES. A survivor is a
# hole in the tests. The catalogue is checked for staleness on every ordinary test run
# (tests/unit/test_mutation_catalogue.py); this workflow runs the mutations themselves.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches: [main]
    paths:
      - "tools/mutation_check.py"
      - "src/prometheus/core/**"
      - "src/prometheus/volterra/black_scholes.py"
      - "src/prometheus/titan/risk_metrics.py"
      - "src/prometheus/hedging/simulate.py"
      - "src/prometheus/experiments/block_bootstrap.py"
      - ".github/workflows/mutation-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.7"
      - name: Bootstrap pinned package tool with verified wheel hashes
        run: python -m pip install --require-hashes --only-binary=':all:' -r requirements/bootstrap.txt
      - name: Install the locked dependencies
        run: uv sync --locked --all-extras --group build --python 3.14.7
      - name: Inject each fault and require a test to fail
        shell: bash   # -o pipefail: `| tee` must not hide a failure
        run: .venv/bin/python tools/mutation_check.py --json "$RUNNER_TEMP/mutation.json" | tee "$RUNNER_TEMP/mutation.log"
      - name: Summary
        if: always()
        run: |
          {
            echo "### mutation-check"
            echo '```'
            cat "$RUNNER_TEMP/mutation.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
