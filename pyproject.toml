[project]
name = "prometheus-econ"
version = "0.5.4"
description = "PROMETHEUS: research platform for quantitative economics, financial modeling, market forecasting, and neural risk control. Research/simulation only -- not financial advice, not a live-trading system."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PROMETHEUS maintainers" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
]

[project.scripts]
econosim = "prometheus.cli:main"

[project.optional-dependencies]
service = [
    "uvicorn>=0.30",
    "jsonschema>=4.23",
]
recovery = ["cryptography>=46.0"]
# The native desktop application (`econosim desktop`, PR-205/206). Only the Qt "Essentials"
# wheel: the charts are drawn by this project's own QPainter code, so the 170 MB "Addons" wheel
# (QtCharts, WebEngine, ...) is neither needed nor installed. abi3 wheels, so one lock entry
# serves every supported Python. LGPL-3.0-only is the alternative this project relies on; see
# docs/LICENSE_INVENTORY.md for what that does and does not oblige you to do.
desktop = ["PySide6-Essentials>=6.9,<7"]
quantum = [
    "pennylane==0.45.1",
    "pennylane-lightning==0.45.0",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "scipy-stubs>=1.11",
    "scikit-learn>=1.5",
    "types-jsonschema>=4.23",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools==84.2.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[dependency-groups]
build = ["build==1.3.0", "setuptools==84.2.1", "wheel==0.46.3"]
# Installed only by .github/workflows/security.yml (`uv sync --only-group security`),
# hash-locked in uv.lock like everything else -- never fetched ad hoc.
security = ["pip-audit==2.10.1"]
tooling = ["uv==0.13.7"]

[tool.uv]
required-version = "==0.13.7"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "property: hypothesis-based property tests",
]

[tool.coverage.report]
# A floor, not a target. The measured total on the first CI run to report it was 96%
# (20,763 statements, 851 missed on all four Python versions, PR-201); the floor sits two
# points under that, so a change that adds substantial untested code fails the build while
# ordinary churn does not. Raise it when coverage rises; never lower it to make a build pass.
fail_under = 94

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert by definition, bind to "0.0.0.0" / use placeholder tokens as
# fixtures, use seeded non-cryptographic RNGs, and spawn fixed-argv helpers.
# Source files get NO blanket ignore: each justified exception is a visible,
# reviewed `# noqa: Sxxx` next to the line it covers.
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S311", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# PennyLane ships no py.typed marker or stub package (confirmed: no
# `pennylane-stubs` exists on PyPI as of this pin). Narrowly scoped to
# this one third-party import, per pyproject's own quantum-addendum
# note that a documented stub-ignore strategy may be required.
module = "pennylane.*"
ignore_missing_imports = true
