name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Reproducibility, not performance: multi-threaded BLAS reductions sum in a
  # different order depending on how many cores are available, which changes
  # floating-point results in the last bit or two. Pinning every thread pool
  # to 1 removes THAT source of divergence for anyone comparing runs against
  # the same dependency versions -- it does not, on its own, make
  # evidence/*_reference.json's exact-hash replay hold on this runner's own
  # CPU/glibc specifically; see tests/unit/test_replay.py's module-level note
  # for the full account of why that check is local-only, opt-in, and not
  # part of this workflow.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install blueprint extraction dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Bootstrap pinned package tool with verified wheel hashes
        run: python -m pip install --require-hashes --only-binary=':all:' -r requirements/bootstrap.txt
      - name: Check and install locked binary dependencies
        run: uv sync --locked --all-extras --group build --no-install-project --no-build --python '${{ matrix.python-version }}'
      - name: Rebuild wheel twice from independent source snapshots
        run: python tools/reproducible_build.py --uv "$(command -v uv)" --output dist/verified
      - name: Install the verified wheel without resolving new dependencies
        run: uv pip install --python .venv/bin/python --no-deps --offline dist/verified/*.whl
      - name: Smoke-test the verified wheel actually imports
        run: .venv/bin/python -c "import prometheus; print(prometheus.__name__)"
      - name: Reinstall the project editable for the test suite (matches README's own Quickstart)
        run: uv sync --locked --all-extras --group build --python '${{ matrix.python-version }}'
      - name: Lint
        run: .venv/bin/ruff check src tests tools
      - name: Format changed platform modules and tooling
        run: .venv/bin/ruff format --check src/prometheus/jobs src/prometheus/service src/prometheus/recovery src/prometheus/orchestration/recipes.py tools tests/unit/test_job_*.py tests/unit/test_jobs_cli.py tests/unit/test_recipe_registry.py tests/unit/test_service_*.py tests/unit/test_recovery_snapshot.py tests/unit/test_reproducible_build.py
      - name: Type check
        run: .venv/bin/mypy --strict src tools/reproducible_build.py
      - name: Test
        run: .venv/bin/python -m pytest -q --cov=prometheus --cov-report=term-missing
      - name: Replay recorded reference in the reference Python profile
        if: matrix.python-version == '3.14.7'
        # Diagnostic, not a gate: exact-hash replay across different physical
        # machines is not achievable from software configuration alone (see
        # tests/unit/test_replay.py's module-level note) -- this step still
        # runs and reports its real result every time, it just no longer
        # fails the job over a property no CI runner can be expected to meet.
        continue-on-error: true
        run: .venv/bin/python -m prometheus.orchestration.replay evidence/api_reference.json --require-integrity --output dist/reference-replay.json
