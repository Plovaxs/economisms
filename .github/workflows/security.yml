name: security

# Dependency, container-image and supply-chain scanning.
#
# Deliberately its own workflow, not steps inside ci.yml: an advisory published
# tomorrow can turn this red on a commit that changed nothing, and that must
# neither block the test matrix nor be mistaken for a code regression. It runs
# on every change to anything that decides what gets installed or shipped, and
# weekly regardless -- the scheduled run is what notices a NEW advisory against
# dependencies nobody touched.
#
# The audit tool itself is hash-locked in uv.lock (the `security` dependency
# group) like every other dependency, not fetched ad hoc.
on:
  push:
    branches: [main]
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "requirements/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "Dockerfile"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "uv.lock"
      - "pyproject.toml"
      - "requirements/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "Dockerfile"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bootstrap pinned package tool with verified wheel hashes
        run: python -m pip install --require-hashes --only-binary=':all:' -r requirements/bootstrap.txt
      - name: Install the hash-locked audit tool and nothing else
        run: uv sync --locked --only-group security --no-install-project --no-build --python 3.12
      - name: Export every locked dependency, all extras and groups
        run: uv export --locked --all-extras --all-groups --no-emit-project --format requirements-txt -o "${RUNNER_TEMP}/locked.txt"
      - name: Strip local-version tags for the advisory lookup (torch 2.15.0+cpu is the CPU build of PyPI's 2.15.0)
        # PyPI has no "2.15.0+cpu", so pip-audit --strict rightly refuses to guess; advisories are keyed by
        # the upstream release, which is what the tag-less line names. Only the lookup file is changed.
        run: sed -E -i 's/^([A-Za-z0-9_.-]+==[0-9][A-Za-z0-9.!_-]*)\+[A-Za-z0-9._]+/\1/' "${RUNNER_TEMP}/locked.txt"
      - name: Audit them against the PyPI advisory database (nothing is installed)
        run: .venv/bin/pip-audit -r "${RUNNER_TEMP}/locked.txt" --no-deps --disable-pip --strict --progress-spinner off

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install exactly what the lockfile says, running no package scripts
        run: npm ci --ignore-scripts
      - name: Audit runtime and build-time dependencies
        run: npm audit --audit-level=high
      - name: Verify registry signatures and provenance of what was installed
        run: npm audit signatures

  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build the runtime image
        run: docker build --target runtime -t econosim:scan .
      - name: Scan it for fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: econosim:scan
          scan-type: image
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
