name: frontend-ci

# Scoped to frontend/ via `paths` so this never runs on, or blocks,
# ordinary Python-only changes -- a completely separate CI surface
# from .github/workflows/ci.yml, same discipline that keeps the
# frontend itself an additive, non-replacing piece of this repo.
on:
  push:
    paths: ["frontend/**"]
  pull_request:
    paths: ["frontend/**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
