[project]
name = "prometheus-econ"
version = "0.1.0"
description = "PROMETHEUS: research platform for computational economics, stochastic finance, and neural risk control. Research/simulation only -- not financial advice, not a live-trading system."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "PROMETHEUS maintainers" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.2",
]

[project.optional-dependencies]
service = [
    "uvicorn>=0.30",
    "jsonschema>=4.23",
]
recovery = ["cryptography>=46.0"]
quantum = [
    "pennylane==0.45.1",
    "pennylane-lightning==0.45.0",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "scipy-stubs>=1.11",
    "scikit-learn>=1.5",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["setuptools==78.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[dependency-groups]
build = ["build==1.3.0", "setuptools==78.1.0", "wheel==0.45.1"]
tooling = ["uv==0.13.7"]

[tool.uv]
required-version = "==0.13.7"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "property: hypothesis-based property tests",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# PennyLane ships no py.typed marker or stub package (confirmed: no
# `pennylane-stubs` exists on PyPI as of this pin). Narrowly scoped to
# this one third-party import, per pyproject's own quantum-addendum
# note that a documented stub-ignore strategy may be required.
module = "pennylane.*"
ignore_missing_imports = true
