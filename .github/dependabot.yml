version: 2

# Version-update PRs, grouped so one ecosystem produces one PR a week. These are
# proposals: every one still has to pass the full CI matrix and be merged by a
# human. Major-version jumps and the pinned build/numerics tooling are
# deliberately NOT automated -- each is a migration with its own verification
# (React 19, a new Python line, a new torch changing floating-point results that
# the committed reference bundles pin to the bit, a new setuptools changing the
# wheel that tools/reproducible_build.py verifies), done as a deliberate PR.
# Digest bumps of the pinned base images and SHA bumps of the pinned actions are
# exactly what this is for, and ARE automated.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "torch"
      - dependency-name: "numpy"
      - dependency-name: "scipy"
      - dependency-name: "pennylane*"
      - dependency-name: "setuptools"
      - dependency-name: "wheel"
      - dependency-name: "build"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
